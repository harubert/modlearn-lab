  <animate attributeName="fill" dur="9.6s" begin="0s" repeatCount="indefinite" calcMode="discrete" values="#545f71;#254287" keyTimes="0;0.569"/>
</circle>
<circle r="5" fill="#545f71" stroke="#ffffff" stroke-width="1.5" opacity="0">
  <animateMotion dur="13.8s" begin="4.8s" repeatCount="indefinite" path="M 274,189 L 352,189 L 352,333 L 706,333 L 792,333 L 792,405 L 706,405 L 706,236 L 792,236 L 792,252 L 706,252 L 706,465 L 352,465 L 352,215 L 274,215"/>
  <animate attributeName="opacity" dur="13.8s" begin="4.8s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.04;0.95;1"/>
</circle>
