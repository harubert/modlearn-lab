<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="titel beschreibung">
<title id="titel">Concept B: one model writes, a second one judges</title>
<desc id="beschreibung">A child on a phone sends a contribution over HTTPS to the web server. The server runs deterministic checks while a separate gatekeeper model on the model host judges whether the contribution belongs to the lesson. A no is answered by a fixed sentence written by the server; yes or unclear goes to the main model, which writes the help, followed by output checks.</desc>
<defs>
<marker id="pf-neutral" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#545f71"/></marker>
<marker id="pf-akzent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#254287"/></marker>
</defs>
<rect width="1200" height="900" rx="16" fill="#ffffff"/>
<text x="24" y="44" font-size="22" font-weight="600" fill="#1a2230" text-anchor="start">Concept B: one model writes, a second one judges</text>
<text x="24" y="68" font-size="13" font-weight="normal" fill="#545f71" text-anchor="start">ModLearn Lab · the path of one contribution in a lesson · the model host is never reachable from the internet</text>
<rect x="24" y="96" width="266" height="360" rx="14" fill="#f8f9fb" stroke="#cfd6e0" stroke-width="1.2"/>
<text x="38" y="118" font-size="11.5" font-weight="600" fill="#545f71" text-anchor="start" letter-spacing="0.08em">PUBLIC INTERNET</text>
<rect x="24" y="560" width="266" height="192" rx="14" fill="#f8f9fb" stroke="#cfd6e0" stroke-width="1.2" stroke-dasharray="7 6"/>
<text x="38" y="582" font-size="11.5" font-weight="600" fill="#545f71" text-anchor="start" letter-spacing="0.08em">OPTIONAL: QUALITY ASSURANCE</text>
<rect x="330" y="96" width="400" height="656" rx="14" fill="#f8f9fb" stroke="#cfd6e0" stroke-width="1.2"/>
<text x="344" y="118" font-size="11.5" font-weight="600" fill="#545f71" text-anchor="start" letter-spacing="0.08em">WEB SERVER · THE ONLY MACHINE LEARNERS TALK TO</text>
<rect x="770" y="96" width="406" height="656" rx="14" fill="#f8f9fb" stroke="#cfd6e0" stroke-width="1.2"/>
<text x="784" y="118" font-size="11.5" font-weight="600" fill="#545f71" text-anchor="start" letter-spacing="0.08em">MODEL HOST · DGX SPARK · PRIVATE NETWORK ONLY</text>
<rect x="40" y="140" width="234" height="98" rx="9" fill="#ffffff" stroke="#c7cfdb" stroke-width="1.2"/>
<text x="54" y="162" font-size="14" font-weight="600" fill="#1a2230" text-anchor="start">Child on a phone</text>
<text x="54" y="184" font-size="12.5" font-weight="normal" fill="#545f71" text-anchor="start">writes, photographs or</text>
<text x="54" y="201" font-size="12.5" font-weight="normal" fill="#545f71" text-anchor="start">dictates a task,</text>
<text x="54" y="218" font-size="12.5" font-weight="normal" fill="#545f71" text-anchor="start">reads the help</text>
<rect x="40" y="290" width="234" height="134" rx="9" fill="#ffffff" stroke="#c7cfdb" stroke-width="1.2"/>
<text x="54" y="312" font-size="14" font-weight="600" fill="#1a2230" text-anchor="start">Teacher</text>
<text x="54" y="334" font-size="12.5" font-weight="normal" fill="#545f71" text-anchor="start">starts the lesson, sets the</text>
<text x="54" y="351" font-size="12.5" font-weight="normal" fill="#545f71" text-anchor="start">help limit and lesson type,</text>
<text x="54" y="368" font-size="12.5" font-weight="normal" fill="#545f71" text-anchor="start">switches quality assurance</text>
<text x="54" y="385" font-size="12.5" font-weight="normal" fill="#545f71" text-anchor="start">on or off, reads every turn</text>
<rect x="40" y="600" width="234" height="118" rx="9" fill="#ffffff" stroke="#c7cfdb" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="54" y="622" font-size="14" font-weight="600" fill="#1a2230" text-anchor="start">External frontier model</text>
<text x="54" y="644" font-size="12.5" font-weight="normal" fill="#545f71" text-anchor="start">optional, OpenAI-compatible,</text>
<text x="54" y="661" font-size="12.5" font-weight="normal" fill="#545f71" text-anchor="start">gets the task text only:</text>
<text x="54" y="678" font-size="12.5" font-weight="normal" fill="#545f71" text-anchor="start">rewritten without persons,</text>
<text x="54" y="695" font-size="12.5" font-weight="normal" fill="#545f71" text-anchor="start">masked and leak-checked</text>
<rect x="346" y="174" width="368" height="30" rx="7" fill="#ffffff" stroke="#c7cfdb" stroke-width="1.2"/>
<text x="530" y="194" font-size="12" font-weight="normal" fill="#545f71" text-anchor="middle">Caddy · reverse proxy · HTTPS with TLS</text>
<rect x="346" y="212" width="368" height="386" rx="9" fill="#ffffff" stroke="#c7cfdb" stroke-width="1.2"/>
<text x="362" y="234" font-size="14" font-weight="600" fill="#1a2230" text-anchor="start">Django application</text>
<text x="698" y="234" font-size="11.5" font-weight="normal" fill="#545f71" text-anchor="end">server-rendered, HTMX, SSE</text>
<rect x="362" y="262" width="336" height="64" rx="9" fill="#ffffff" stroke="#c7cfdb" stroke-width="1.2"/>
<text x="376" y="284" font-size="13" font-weight="600" fill="#1a2230" text-anchor="start">Deterministic checks</text>
<text x="376" y="314" font-size="12" font-weight="normal" fill="#545f71" text-anchor="start">traffic light, bare numbers, quotes</text>
<circle cx="600" cy="282" r="5" fill="#1d7a4a"/>
<circle cx="614" cy="282" r="5" fill="#c08a00"/>
<circle cx="628" cy="282" r="5" fill="#a52a24"/>
<rect x="362" y="340" width="336" height="78" rx="9" fill="#e7ecf6" stroke="#254287" stroke-width="2"/>
<text x="376" y="362" font-size="13" font-weight="600" fill="#1b3369" text-anchor="start">Fixed sentence, written by the server</text>
<text x="376" y="390" font-size="12" font-weight="normal" fill="#1a2230" text-anchor="start">when the judge says no: the same sentence</text>
<text x="376" y="407" font-size="12" font-weight="normal" fill="#1a2230" text-anchor="start">per subject, no model text at all</text>
<rect x="362" y="432" width="336" height="78" rx="9" fill="#ffffff" stroke="#c7cfdb" stroke-width="1.2"/>
<text x="376" y="454" font-size="13" font-weight="600" fill="#1a2230" text-anchor="start">Output checks</text>
<text x="376" y="482" font-size="12" font-weight="normal" fill="#545f71" text-anchor="start">no solution before the last level,</text>
<text x="376" y="499" font-size="12" font-weight="normal" fill="#545f71" text-anchor="start">no invented quotes, no narrowing question</text>
<rect x="362" y="524" width="336" height="66" rx="9" fill="#ffffff" stroke="#c7cfdb" stroke-width="1.2"/>
<text x="376" y="546" font-size="13" font-weight="600" fill="#1a2230" text-anchor="start">Safe chat</text>
<text x="376" y="566" font-size="12" font-weight="normal" fill="#545f71" text-anchor="start">checks the answer for the form of a political</text>
<text x="376" y="583" font-size="12" font-weight="normal" fill="#545f71" text-anchor="start">refusal, not for its topic</text>
<rect x="346" y="612" width="120" height="72" rx="9" fill="#ffffff" stroke="#c7cfdb" stroke-width="1.2"/>
<text x="360" y="634" font-size="13" font-weight="600" fill="#1a2230" text-anchor="start">PostgreSQL</text>
<text x="360" y="656" font-size="12" font-weight="normal" fill="#545f71" text-anchor="start">sessions, tasks,</text>
<text x="360" y="673" font-size="12" font-weight="normal" fill="#545f71" text-anchor="start">protocol</text>
<rect x="482" y="612" width="232" height="72" rx="9" fill="#ffffff" stroke="#c7cfdb" stroke-width="1.2"/>
<text x="496" y="634" font-size="13" font-weight="600" fill="#1a2230" text-anchor="start">Research protocol, 3 levels</text>
<text x="496" y="656" font-size="12" font-weight="normal" fill="#545f71" text-anchor="start">operation: counts, no text</text>
<text x="496" y="673" font-size="12" font-weight="normal" fill="#545f71" text-anchor="start">masked or full, set per lesson</text>
<rect x="346" y="698" width="368" height="46" rx="9" fill="#ffffff" stroke="#c7cfdb" stroke-width="1.2"/>
<text x="360" y="720" font-size="13" font-weight="600" fill="#1a2230" text-anchor="start">Model watch</text>
<text x="360" y="736" font-size="12" font-weight="normal" fill="#545f71" text-anchor="start">daily check of the model registries</text>
<rect x="786" y="140" width="374" height="122" rx="9" fill="#ffffff" stroke="#c7cfdb" stroke-width="1.2"/>
<text x="800" y="162" font-size="14" font-weight="600" fill="#1a2230" text-anchor="start">Qwen3.6-35B-A3B · port 8000</text>
<text x="800" y="184" font-size="12.5" font-weight="normal" fill="#545f71" text-anchor="start">writes: diagnosis, help levels 1 to 5,</text>
<text x="800" y="201" font-size="12.5" font-weight="normal" fill="#545f71" text-anchor="start">coach turns; reads text and images</text>
<text x="800" y="218" font-size="12.5" font-weight="normal" fill="#545f71" text-anchor="start">(vLLM, OpenAI-compatible chat API)</text>
<rect x="786" y="300" width="374" height="144" rx="9" fill="#e7ecf6" stroke="#254287" stroke-width="2"/>
<text x="800" y="322" font-size="14" font-weight="600" fill="#1b3369" text-anchor="start">Gatekeeper · Ministral 3 8B · port 8004</text>
<text x="800" y="344" font-size="12.5" font-weight="normal" fill="#1a2230" text-anchor="start">judges one question only: does this</text>
<text x="800" y="361" font-size="12.5" font-weight="normal" fill="#1a2230" text-anchor="start">belong to the lesson? Yes, no or unclear.</text>
<text x="800" y="378" font-size="12.5" font-weight="normal" fill="#1a2230" text-anchor="start">It never writes a word for the child.</text>
<text x="800" y="395" font-size="12.5" font-weight="normal" fill="#1a2230" text-anchor="start">Unreachable means unclear: the question passes.</text>
<rect x="786" y="480" width="178" height="66" rx="9" fill="#ffffff" stroke="#c7cfdb" stroke-width="1.2"/>
<text x="800" y="502" font-size="13" font-weight="600" fill="#1a2230" text-anchor="start">Whisper · port 8002</text>
<text x="800" y="524" font-size="12.5" font-weight="normal" fill="#545f71" text-anchor="start">speech recognition</text>
<rect x="982" y="480" width="178" height="66" rx="9" fill="#ffffff" stroke="#c7cfdb" stroke-width="1.2"/>
<text x="996" y="502" font-size="13" font-weight="600" fill="#1a2230" text-anchor="start">Qwen3-TTS · port 8003</text>
<text x="996" y="524" font-size="12.5" font-weight="normal" fill="#545f71" text-anchor="start">server voice</text>
<text x="786" y="614" font-size="12" font-weight="normal" fill="#545f71" text-anchor="start">128 GB unified memory: the writing model and the judge</text>
<text x="786" y="632" font-size="12" font-weight="normal" fill="#545f71" text-anchor="start">are loaded side by side. Concept A would let the main</text>
<text x="786" y="650" font-size="12" font-weight="normal" fill="#545f71" text-anchor="start">model judge its own lesson boundary; B separates the two.</text>
<path d="M 274,189 L 346,189" fill="none" stroke="#545f71" stroke-width="1.6" marker-end="url(#pf-neutral)"/>
<text x="310" y="181" font-size="11.5" font-weight="normal" fill="#545f71" text-anchor="middle">HTTPS</text>
<path d="M 346,215 L 274,215" fill="none" stroke="#545f71" stroke-width="1.6" marker-end="url(#pf-neutral)"/>
<text x="310" y="230" font-size="11.5" font-weight="normal" fill="#545f71" text-anchor="middle">answer</text>
<path d="M 274,350 L 346,350" fill="none" stroke="#545f71" stroke-width="1.6" marker-end="url(#pf-neutral)"/>
<text x="310" y="342" font-size="11.5" font-weight="normal" fill="#545f71" text-anchor="middle">settings</text>
<path d="M 714,236 L 786,236" fill="none" stroke="#545f71" stroke-width="1.6" marker-end="url(#pf-neutral)"/>
<text x="750" y="228" font-size="11.5" font-weight="normal" fill="#545f71" text-anchor="middle">request</text>
<path d="M 786,252 L 714,252" fill="none" stroke="#545f71" stroke-width="1.6" marker-end="url(#pf-neutral)"/>
<text x="750" y="267" font-size="11.5" font-weight="normal" fill="#545f71" text-anchor="middle">answer</text>
<path d="M 714,333 L 786,333" fill="none" stroke="#254287" stroke-width="1.6" marker-end="url(#pf-akzent)"/>
<text x="750" y="325" font-size="11.5" font-weight="normal" fill="#545f71" text-anchor="middle">question</text>
<path d="M 786,405 L 714,405" fill="none" stroke="#254287" stroke-width="1.6" marker-end="url(#pf-akzent)"/>
<text x="750" y="420" font-size="11.5" font-weight="normal" fill="#545f71" text-anchor="middle">verdict</text>
<path d="M 714,513 L 786,513" fill="none" stroke="#545f71" stroke-width="1.6" marker-end="url(#pf-neutral)" marker-start="url(#pf-neutral)"/>
<text x="750" y="505" font-size="11.5" font-weight="normal" fill="#545f71" text-anchor="middle">audio</text>
<path d="M 714,540 L 750,540 L 750,572 L 1071,572 L 1071,548" fill="none" stroke="#545f71" stroke-width="1.6" marker-end="url(#pf-neutral)" marker-start="url(#pf-neutral)"/>
<text x="910" y="586" font-size="11.5" font-weight="normal" fill="#545f71" text-anchor="middle">speech</text>
<path d="M 346,560 L 310,560 L 310,659 L 274,659" fill="none" stroke="#545f71" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#pf-neutral)" marker-start="url(#pf-neutral)"/>
<circle cx="40" cy="140" r="10" fill="#254287" stroke="#ffffff" stroke-width="2"/>
<text x="40" y="144" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<circle cx="370" cy="262" r="10" fill="#254287" stroke="#ffffff" stroke-width="2"/>
<text x="370" y="266" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<circle cx="786" cy="300" r="10" fill="#254287" stroke="#ffffff" stroke-width="2"/>
<text x="786" y="304" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<circle cx="370" cy="340" r="10" fill="#254287" stroke="#ffffff" stroke-width="2"/>
<text x="370" y="344" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<circle cx="786" cy="140" r="10" fill="#254287" stroke="#ffffff" stroke-width="2"/>
<text x="786" y="144" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<circle cx="370" cy="432" r="10" fill="#254287" stroke="#ffffff" stroke-width="2"/>
<text x="370" y="436" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<circle cx="40" cy="290" r="10" fill="#254287" stroke="#ffffff" stroke-width="2"/>
<text x="40" y="294" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<circle cx="490" cy="612" r="10" fill="#254287" stroke="#ffffff" stroke-width="2"/>
<text x="490" y="616" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="24" y="792" font-size="14" font-weight="600" fill="#1a2230" text-anchor="start">What concept B means</text>
<text x="24" y="814" font-size="12.5" font-weight="normal" fill="#545f71" text-anchor="start">Two models with two jobs. Qwen writes the help; Ministral only judges whether a</text>
<text x="24" y="831" font-size="12.5" font-weight="normal" fill="#545f71" text-anchor="start">contribution belongs to the lesson. A no is answered with a fixed sentence the server</text>
<text x="24" y="848" font-size="12.5" font-weight="normal" fill="#545f71" text-anchor="start">writes, never a model. Yes and unclear go to Qwen; if the judge is unreachable, the</text>
<text x="24" y="865" font-size="12.5" font-weight="normal" fill="#545f71" text-anchor="start">question passes. Ports on the model host: 8000 chat, 8002 speech recognition,</text>
<text x="24" y="882" font-size="12.5" font-weight="normal" fill="#545f71" text-anchor="start">8003 voice, 8004 gatekeeper. Nothing on that machine is reachable from the internet.</text>
<text x="640" y="792" font-size="14" font-weight="600" fill="#1a2230" text-anchor="start">One contribution, five steps</text>
<circle cx="650" cy="810" r="10" fill="#254287" stroke="#ffffff" stroke-width="2"/>
<text x="650" y="814" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="668" y="814" font-size="12.5" font-weight="normal" fill="#545f71" text-anchor="start">The child's contribution arrives over HTTPS at the web server.</text>
<circle cx="650" cy="827" r="10" fill="#254287" stroke="#ffffff" stroke-width="2"/>
<text x="650" y="831" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="668" y="831" font-size="12.5" font-weight="normal" fill="#545f71" text-anchor="start">Deterministic checks and the gatekeeper run in parallel.</text>
<circle cx="650" cy="844" r="10" fill="#254287" stroke="#ffffff" stroke-width="2"/>
<text x="650" y="848" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="668" y="848" font-size="12.5" font-weight="normal" fill="#545f71" text-anchor="start">No: the server answers with the fixed sentence.</text>
<circle cx="650" cy="861" r="10" fill="#254287" stroke="#ffffff" stroke-width="2"/>
<text x="650" y="865" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="668" y="865" font-size="12.5" font-weight="normal" fill="#545f71" text-anchor="start">Yes or unclear: Qwen writes the help, output checks follow.</text>
<circle cx="650" cy="878" r="10" fill="#254287" stroke="#ffffff" stroke-width="2"/>
<text x="650" y="882" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="668" y="882" font-size="12.5" font-weight="normal" fill="#545f71" text-anchor="start">The child reads it, the teacher sees every turn, one protocol line per model call.</text>
<circle r="5" fill="#545f71" stroke="#ffffff" stroke-width="1.5" opacity="0">
  <animateMotion dur="9.6s" begin="0s" repeatCount="indefinite" path="M 274,189 L 352,189 L 352,333 L 706,333 L 792,333 L 792,405 L 706,405 L 706,373 L 352,373 L 352,215 L 274,215"/>
